name: React CI Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  test-react-app:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      API_URL: https://api.mycompany.com

    steps:
      - name: 1. Download Code from GitHub
        uses: actions/checkout@v4

      - name: 2. Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install React Dependencies
        run: npm install

      - name: Create .env file for the Build
        run: |
          echo "VITE_NODE_ENV=${{ env.NODE_ENV }}" >> .env
          echo "VITE_API_URL=${{ env.API_URL }}" >> .env
          echo "VITE_SECRET_KEY=${{ secrets.MY_API_KEY }}" >> .env

      - name: 4. Check if the App Builds Successfully
        run: npm run build

      - name: 5. Save the Build (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: react-production-build
          path: dist/

  deploy-dev:
    needs: test-react-app
    environment: Development
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      API_URL: https://dev-api.mycompany.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: react-production-build
          path: dist/
      - run: |
          echo "🚀 Deploying to DEV Server..."
          echo "Setting mode to: $NODE_ENV"
          echo "Connecting to: $API_URL"

  deploy-staging:
    needs: deploy-dev
    environment: Staging
    runs-on: ubuntu-latest
    env:
      NODE_ENV: staging
      API_URL: https://staging-api.mycompany.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: react-production-build
          path: dist/
      - run: |
          echo "🧪 Deploying to STAGING Server..."
          echo "Setting mode to: $NODE_ENV"
          echo "Connecting to: $API_URL"

  deploy-prod:
    needs: deploy-staging
    environment: Production
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      API_URL: https://api.mycompany.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: react-production-build
          path: dist/
      - run: |
          echo "🌐 Deploying to PRODUCTION Server..."
          echo "Setting mode to: $NODE_ENV"
          echo "Connecting to: $API_URL"
          echo "Using Prod Secret: ${{ secrets.MY_API_KEY }}"



 
    
